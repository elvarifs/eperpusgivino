<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>E-Perpus GIVINO – Politeknik Givino Nusantara</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#0b3d5c;--deep:#06263b;--blue:#1b7fb3;--sky:#34a6d6;--gold:#f2b544;--bg:#f3f8fb;--ink:#0d2233;--mut:#5b7285;--line:#dce8ef;--ok:#138a5b;--warn:#c27a0a;--bad:#c0392b}
*{box-sizing:border-box;margin:0}
html{overflow-y:scroll}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.55;min-height:100vh}
h1,h2,h3{font-family:'Fraunces',Georgia,serif;line-height:1.15}
button,input,select{font:inherit;color:inherit}button{cursor:pointer;border:0}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.9);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 5vw;min-height:68px}
.brand{display:flex;align-items:center;gap:10px;cursor:pointer;margin-right:auto}
.brand img{height:46px;width:46px;object-fit:contain;mix-blend-mode:multiply}
.brand b{font-family:'Fraunces',serif;font-size:1.15rem;color:var(--navy);display:block;line-height:1.1}
.brand small{color:var(--mut);font-size:.72rem}
nav{display:flex;gap:6px;align-items:center}
.btn{padding:10px 18px;border-radius:12px;font-weight:600;background:var(--navy);color:#fff;transition:transform .15s,box-shadow .15s;white-space:nowrap}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(11,61,92,.25)}
.btn.ghost{background:transparent;color:var(--navy)}.btn.ghost:hover{background:#e6f1f7;box-shadow:none}
.btn.gold{background:var(--gold);color:#2b1c00}
.btn.sm{padding:6px 12px;font-size:.82rem;border-radius:9px}
.btn.ok{background:var(--ok)}.btn.bad{background:var(--bad)}.btn[disabled]{opacity:.45;pointer-events:none}
main{min-height:80vh;padding-bottom:50px}
.wrap{padding:0 5vw;max-width:1280px;margin:auto}
/* HERO */
.hero{position:relative;overflow:hidden;color:#fff;background:radial-gradient(rgba(255,255,255,.08) 1px,transparent 1px) 0 0/22px 22px,linear-gradient(160deg,#0b3d5c,#06263b)}
.hero:before,.hero:after{content:"";position:absolute;border-radius:50%;filter:blur(70px);animation:drift 14s ease-in-out infinite alternate}
.hero:before{width:480px;height:480px;background:#1b7fb3;right:-120px;top:-160px;opacity:.6}
.hero:after{width:360px;height:360px;background:#34a6d6;left:-120px;bottom:-200px;opacity:.35;animation-delay:-6s}
@keyframes drift{to{transform:translate(-60px,50px) scale(1.15)}}
.hero .wrap{position:relative;z-index:1;display:grid;grid-template-columns:1.15fr 1fr;gap:20px;align-items:center;padding-top:50px;padding-bottom:66px}
.hero h1{font-size:clamp(2.1rem,5vw,3.7rem);margin-bottom:16px}
.hero p{color:#bcdcec;max-width:48ch;margin-bottom:24px}
.hs{display:flex;gap:30px;margin-top:34px;flex-wrap:wrap}.hs b{font-family:'Fraunces',serif;font-size:1.9rem;display:block;line-height:1}.hs span{color:#9cc6dc;font-size:.82rem}
.scene{perspective:900px;height:350px;display:grid;place-items:center;position:relative}
.scene:after{content:"";position:absolute;bottom:34px;width:190px;height:26px;border-radius:50%;background:rgba(0,0,0,.4);filter:blur(12px);animation:sh 16s linear infinite}
@keyframes sh{50%{transform:scaleX(.7)}}
.cube{width:160px;height:220px;position:relative;transform-style:preserve-3d;animation:spin 16s linear infinite}
@keyframes spin{from{transform:rotateX(-14deg) rotateY(0)}to{transform:rotateX(-14deg) rotateY(360deg)}}
.cube>div{position:absolute;display:grid;place-items:center;text-align:center;font-family:'Fraunces',serif}
.cf,.cb{width:160px;height:220px;background:linear-gradient(145deg,#34a6d6,#0b3d5c);border-radius:4px 10px 10px 4px;font-size:1.25rem;padding:14px;color:#fff;box-shadow:inset 0 0 0 6px rgba(255,255,255,.12)}
.cf{transform:translateZ(26px)}.cb{transform:translateZ(-26px) rotateY(180deg);background:#0b3d5c}
.cr,.cl{width:52px;height:220px;left:54px;background:repeating-linear-gradient(0deg,#f6f1e4 0 3px,#e6dec8 3px 4px)}
.cr{transform:rotateY(90deg) translateZ(80px)}.cl{transform:rotateY(-90deg) translateZ(80px);background:#06263b}
.ct,.cbm{width:160px;height:52px;top:84px;background:#efe8d4}
.ct{transform:rotateX(90deg) translateZ(110px)}.cbm{transform:rotateX(-90deg) translateZ(110px)}
.fb{position:absolute;border-radius:3px 8px 8px 3px;animation:fl 6s ease-in-out infinite;box-shadow:inset 6px 0 0 rgba(0,0,0,.25)}
@keyframes fl{50%{transform:translateY(-24px) rotate(10deg)}}
/* FILTER */
.bar{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px;margin-top:-30px;position:relative;z-index:2;display:grid;grid-template-columns:2fr 1fr;gap:10px;box-shadow:0 14px 40px rgba(11,61,92,.14)}
input,select{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:#fff}
input:focus,select:focus{border-color:var(--sky);outline:0}
.chips{display:flex;gap:8px;overflow-x:auto;padding:18px 0 4px}
.chips button{padding:8px 16px;border-radius:99px;background:#fff;border:1px solid var(--line);font-weight:600;font-size:.85rem;white-space:nowrap;transition:.15s}
.chips button:hover{border-color:var(--sky)}.chips .on{background:var(--navy);color:#fff;border-color:var(--navy)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:22px;padding:22px 0;min-height:300px}
.card{perspective:700px}
.card .in{background:#fff;border:1px solid var(--line);border-radius:20px;padding:14px;transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .2s,box-shadow .2s;height:100%;display:flex;flex-direction:column;gap:7px}
.card:hover .in{box-shadow:0 22px 44px rgba(11,61,92,.18)}
.cover{height:178px;border-radius:4px 14px 14px 4px;padding:16px 14px 14px 24px;color:#fff;display:flex;flex-direction:column;justify-content:flex-end;position:relative;box-shadow:7px 10px 18px rgba(11,61,92,.3);margin-bottom:6px;overflow:hidden}
.cover:before{content:"";position:absolute;inset:0 auto 0 0;width:11px;background:rgba(0,0,0,.28)}
.cover:after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,rgba(255,255,255,.3),transparent 42%,rgba(0,0,0,.18));pointer-events:none}
.cover svg{position:absolute;right:12px;top:12px;width:30px;opacity:.55}
.cover b{font-family:'Fraunces',serif;font-size:1.05rem;line-height:1.2;position:relative;z-index:1}
.cover span{font-size:.72rem;opacity:.85;position:relative;z-index:1}
.tag{display:inline-block;background:#e6f1f7;color:var(--navy);padding:2px 9px;border-radius:99px;font-size:.72rem;font-weight:600;margin:0 4px 4px 0}
.card .btn{margin-top:auto}
.empty{grid-column:1/-1;text-align:center;color:var(--mut);padding:50px 0}
/* PANELS */
.panel{background:#fff;border:1px solid var(--line);border-radius:20px;padding:22px;margin-top:18px}
.adm{display:grid;grid-template-columns:230px minmax(0,1fr);gap:22px;padding-top:28px;align-items:start}
.side{position:sticky;top:90px;background:linear-gradient(170deg,var(--navy),var(--deep));color:#fff;border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:6px;box-shadow:0 16px 36px rgba(11,61,92,.25)}
.side .me{padding:4px 8px 14px;border-bottom:1px solid rgba(255,255,255,.15);margin-bottom:8px;font-size:.82rem;color:#9cc6dc;overflow-wrap:anywhere}.side .me b{display:block;color:#fff;font-size:1rem;font-family:'Fraunces',serif}
.side button{background:none;color:#cfe6f2;text-align:left;padding:11px 14px;border-radius:12px;font-weight:600;transition:.15s}
.side button:hover{background:rgba(255,255,255,.08)}.side button.on{background:rgba(255,255,255,.17);color:#fff;box-shadow:inset 3px 0 0 var(--gold)}
.main{margin:0;min-height:72vh}
.main h2{font-size:1.5rem;margin-bottom:16px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px}
.stat{background:linear-gradient(145deg,#fff,#eaf4fa);border:1px solid var(--line);border-radius:18px;padding:16px;position:relative;overflow:hidden}
.stat em{font-style:normal;font-size:1.3rem;display:grid;place-items:center;width:40px;height:40px;border-radius:12px;background:var(--navy);margin-bottom:10px}
.stat b{font-family:'Fraunces',serif;font-size:2rem;color:var(--navy);display:block;line-height:1.1}
.stat span{color:var(--mut);font-size:.85rem}
.row{display:flex;gap:10px;align-items:center;padding:13px 6px;border-bottom:1px solid var(--line);flex-wrap:wrap;border-radius:10px}
.row:hover{background:#f6fafc}.row:last-child{border:0}.row>div:first-child{flex:1;min-width:180px}
.chip{padding:3px 11px;border-radius:99px;font-size:.75rem;font-weight:700;background:#e6f1f7;color:var(--navy)}
.Menunggu{background:#fdf0d5;color:var(--warn)}.Disetujui{background:#dcf3e8;color:var(--ok)}.Ditolak{background:#fbe0dc;color:var(--bad)}.Dikembalikan{background:#e8e8ef;color:#555}
.bars div{display:grid;grid-template-columns:110px 1fr 30px;gap:10px;align-items:center;margin:8px 0;font-size:.85rem}
.bars i{display:block;height:12px;border-radius:99px;background:linear-gradient(90deg,var(--sky),var(--navy));width:0;transition:width 1s cubic-bezier(.2,.8,.2,1)}
form.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.pw{position:relative}.pw button{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;padding:8px;font-size:1.05rem}
/* MODAL */
#modal{position:fixed;inset:0;background:rgba(6,38,59,.6);backdrop-filter:blur(5px);display:none;place-items:center;z-index:50;padding:16px}
#modal.on{display:grid}
.box{background:#fff;border-radius:24px;padding:26px;width:min(440px,100%);max-height:92vh;overflow:auto;animation:pop .35s cubic-bezier(.2,1.2,.3,1)}
@keyframes pop{from{transform:scale(.85) rotateX(20deg);opacity:0}}
.box h2{margin-bottom:6px}.s{color:var(--mut);font-size:.9rem;margin-bottom:14px}
.box label{display:block;font-size:.82rem;font-weight:600;margin:10px 0 4px}
.sw{display:flex;background:var(--bg);border-radius:12px;padding:4px;margin-bottom:12px}
.sw button{flex:1;padding:9px;border-radius:9px;background:none;font-weight:600}.sw .on{background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.1)}
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,120px);background:var(--ink);color:#fff;padding:12px 20px;border-radius:14px;z-index:120;transition:transform .3s;max-width:90vw}
#toast.on{transform:translate(-50%,0)}
/* LOADER 3D */
#ld{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;background:radial-gradient(circle at 50% 35%,#0f5a85,#06263b 70%);color:#fff;opacity:0;pointer-events:none;transition:opacity .35s}
#ld.on{opacity:1;pointer-events:all}
#ld .sc{perspective:800px;height:250px;width:200px;display:grid;place-items:center;transform:scale(.62)}
#ld .sc .cube{animation-duration:4s}
#ld .sc:before{content:"";position:absolute;width:300px;height:300px;border:2px dashed rgba(242,181,68,.45);border-radius:50%;transform:rotateX(75deg);animation:rg 6s linear infinite}
@keyframes rg{to{transform:rotateX(75deg) rotateZ(360deg)}}
#ld p{font-family:'Fraunces',serif;font-size:1.2rem}#ld small{color:#9cc6dc}
.pb{width:170px;height:4px;background:rgba(255,255,255,.2);border-radius:9px;overflow:hidden;margin-top:6px}
.pb:after{content:"";display:block;width:40%;height:100%;background:var(--gold);animation:sl 1.1s infinite}
@keyframes sl{from{transform:translateX(-100%)}to{transform:translateX(260%)}}
footer{text-align:center;color:var(--mut);font-size:.8rem;padding:26px 5vw;border-top:1px solid var(--line)}
@media(max-width:800px){.hero .wrap{grid-template-columns:1fr}.scene{height:270px;transform:scale(.8)}.bar{grid-template-columns:1fr}.brand small{display:none}
.adm{grid-template-columns:1fr;padding-top:18px}.side{position:static;flex-direction:row;overflow-x:auto;padding:8px;border-radius:16px}.side .me{display:none}.side button{white-space:nowrap}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="ld" class="on"><div class="sc"><div class="cube"><div class="cf">E-Perpus<br>GIVINO</div><div class="cb"></div><div class="cr"></div><div class="cl"></div><div class="ct"></div><div class="cbm"></div></div></div><p>E-Perpus GIVINO</p><small id="ldt">Membuka rak buku…</small><div class="pb"></div></div>
<header>
  <div class="brand" onclick="go('home')"><img src="logo.jpg" alt="Logo Givino"><div><b>E-Perpus GIVINO</b><small>Politeknik Givino Nusantara</small></div></div>
  <nav id="nav"></nav>
</header>
<main id="v"></main>
<footer>© <span id="yr"></span> Politeknik Givino Nusantara · Yayasan Givino Nusantara</footer>
<div id="modal"></div><div id="toast"></div>
<script>
// ====== GANTI DENGAN URL WEB APP APPS SCRIPT ANDA ======
const API = 'https://script.google.com/macros/s/AKfycbxuU0ueGiNLFOskQB_Wg4sdhb__POZdIFt9LCqZGrKzLcXMbGy0fJyQTpx6oxCMuZJ4/exec';
// =======================================================
const DEMO = API.startsWith('PASTE');
const SAMPLE = [
['Pemrograman Web Modern','Rina Kusuma','Teknologi','Teknik Informatika',2023,5,3],
['Basis Data Lanjutan','Budi Santoso','Teknologi','Teknik Informatika',2022,4,4],
['Jaringan Komputer','Agus Prasetyo','Teknologi','Teknik Informatika',2021,6,2],
['Kecerdasan Buatan Dasar','Maya Anggraini','Teknologi','Teknik Informatika',2024,3,3],
['Akuntansi Keuangan','Dewi Lestari','Ekonomi','Akuntansi',2021,6,5],
['Perpajakan Indonesia','Yusuf Hakim','Ekonomi','Akuntansi',2022,4,1],
['Manajemen Strategis','Andi Wijaya','Bisnis','Manajemen Bisnis',2020,3,3],
['Pemasaran Digital','Laras Permata','Bisnis','Manajemen Bisnis',2023,5,4],
['Dasar Termodinamika','Hendra Putra','Teknik','Teknik Mesin',2019,2,0],
['Mekanika Fluida','Rudi Hartono','Teknik','Teknik Mesin',2020,3,2],
['Rangkaian Listrik','Fajar Nugroho','Teknik','Teknik Elektro',2021,4,4],
['Metodologi Penelitian','Siti Aminah','Umum','Semua Jurusan',2022,8,7]
].map((b,i)=>({id:'demo'+i,judul:b[0],penulis:b[1],kategori:b[2],jurusan:b[3],tahun:b[4],total:b[5],stok:b[6]}));
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const CUBE = `<div class="cf">E-Perpus<br>GIVINO</div><div class="cb"></div><div class="cr"></div><div class="cl"></div><div class="ct"></div><div class="cbm"></div>`;
let S = { u: JSON.parse(localStorage.getItem('u') || 'null'), t: localStorage.getItem('t') || '', books: [], view: 'home', tab: 'stat', q: '', kat: '', jur: '', rt: 0, hold: true };
let busy = 0, ldT;
$('#yr').textContent = new Date().getFullYear();

function ld(on) {
  busy += on ? 1 : -1; clearTimeout(ldT);
  if (busy > 0) ldT = setTimeout(() => $('#ld').classList.add('on'), 120);
  else if (!S.hold) $('#ld').classList.remove('on');
}
async function api(action, d = {}) {
  ld(1);
  try {
    const r = await fetch(API, { method: 'POST', body: JSON.stringify({ action, token: S.t, ...d }) });
    const j = await r.json(); if (!j.ok) throw new Error(j.error); return j.data;
  } catch (e) { toast(e.message === 'Failed to fetch' ? 'Tidak dapat terhubung ke server' : e.message); throw e; }
  finally { ld(0); }
}
function toast(m) { const t = $('#toast'); t.textContent = m; t.className = 'on'; clearTimeout(t._t); t._t = setTimeout(() => t.className = '', 3200); }
function modal(h, close = true) { const m = $('#modal'); m.innerHTML = `<div class="box">${h}</div>`; m.className = 'on'; m.onclick = e => { if (close && e.target === m) shut(); }; }
function shut() { $('#modal').className = ''; }
const pw = (id, lbl = 'Password') => `<label>${lbl}</label><div class="pw"><input id="${id}" type="password" required><button type="button" aria-label="Lihat password" onclick="const i=$('#${id}');i.type=i.type=='password'?'text':'password'">👁</button></div>`;
const hue = s => { let h = 0; for (const c of s) h = (h * 31 + c.charCodeAt(0)) % 360; return h; };
const isAdm = () => S.u && S.u.role === 'admin';
function save(r) { S.t = r.token; S.u = r.user; localStorage.setItem('t', S.t); localStorage.setItem('u', JSON.stringify(S.u)); }
function logout() { S.t = ''; S.u = null; localStorage.clear(); go('home'); }

function navBar() {
  $('#nav').innerHTML = !S.u ? `<button class="btn ghost" onclick="auth('login')">Masuk</button><button class="btn" onclick="auth('register')">Daftar</button>`
    : (isAdm() ? '' : `<button class="btn ghost" onclick="go('home')">Katalog</button>`) + `<button class="btn ghost" onclick="go('dash')">${isAdm() ? 'Dashboard' : 'Pinjaman Saya'}</button><button class="btn" onclick="logout()">Keluar</button>`;
}
function go(v) { if (isAdm()) v = 'dash'; S.view = v; navBar(); scrollTo(0, 0); return v === 'home' ? home() : dash(); }

// ---------- AUTH ----------
function auth(mode = 'login', after) {
  const reg = mode === 'register';
  modal(`<div class="sw"><button class="${reg ? '' : 'on'}" onclick="auth('login','${after || ''}')">Masuk</button><button class="${reg ? 'on' : ''}" onclick="auth('register','${after || ''}')">Daftar</button></div>
  <h2>${reg ? 'Buat akun anggota' : 'Selamat datang kembali'}</h2><p class="s">${reg ? 'Akun diperlukan untuk mengajukan peminjaman buku.' : 'Masuk untuk meminjam buku atau mengelola perpustakaan.'}</p>
  <form onsubmit="event.preventDefault();doAuth('${mode}','${after || ''}')">
  ${reg ? '<label>Nama lengkap</label><input id="a_n" required>' : ''}
  <label>Email</label><input id="a_e" type="email" required>${pw('a_p')}
  <button class="btn" style="width:100%;margin-top:18px">${reg ? 'Daftar sekarang' : 'Masuk'}</button></form>`);
}
async function doAuth(mode, after) {
  const d = { email: $('#a_e').value, password: $('#a_p').value };
  if (mode === 'register') d.nama = $('#a_n').value;
  const r = await api(mode, d); save(r); shut(); toast('Halo, ' + r.user.nama + '!');
  if (isAdm() && !S.u.passSet) { navBar(); return forcePw(); }
  after ? (await go('home'), borrow(after)) : go(isAdm() ? 'dash' : 'home');
}
function forcePw() {
  modal(`<h2>Atur password admin</h2><p class="s">Demi keamanan, password admin hanya dapat diatur <b>satu kali</b> dan tidak bisa diubah lagi. Simpan baik-baik.</p>
  <form onsubmit="event.preventDefault();setPw()">${pw('n_p', 'Password baru (min. 6 karakter)')}<button class="btn" style="width:100%;margin-top:18px">Simpan permanen</button></form>`, false);
}
async function setPw() { await api('setPassword', { password: $('#n_p').value }); S.u.passSet = true; localStorage.setItem('u', JSON.stringify(S.u)); shut(); toast('Password tersimpan'); go('dash'); }

// ---------- KATALOG ----------
async function home() {
  const fb = (c, w, h, l, t, d) => `<div class="fb" style="left:${l};top:${t};width:${w}px;height:${h}px;background:${c};animation-delay:${d}s"></div>`;
  $('#v').innerHTML = `<section class="hero"><div class="wrap"><div><h1>Perpustakaan digital kampus Givino.</h1><p>Cari buku berdasarkan kategori dan jurusan, ajukan peminjaman dari mana saja, dan pantau statusnya langsung dari ponsel Anda.</p><button class="btn gold" onclick="$('#q').focus();$('#q').scrollIntoView({behavior:'smooth',block:'center'})">Cari buku</button>
  <div class="hs" id="hs"><div><b>–</b><span>Judul buku</span></div><div><b>–</b><span>Jurusan</span></div><div><b>–</b><span>Eksemplar tersedia</span></div></div></div>
  <div class="scene">${fb('linear-gradient(145deg,#f2b544,#c98a14)', 46, 66, '8%', '10%', 0)}${fb('linear-gradient(145deg,#34a6d6,#1b7fb3)', 56, 78, '84%', '62%', -2)}${fb('linear-gradient(145deg,#9fd6ee,#34a6d6)', 38, 54, '88%', '14%', -4)}<div class="cube">${CUBE}</div></div></div></section>
  <div class="wrap"><div class="bar"><input id="q" placeholder="Cari judul atau penulis…" oninput="S.q=this.value;grid()" value="${esc(S.q)}"><select id="j" onchange="S.jur=this.value;grid()"></select></div><div class="chips" id="ch"></div><div id="demo"></div><div class="grid" id="g"></div></div>`;
  let demo = DEMO;
  if (!DEMO) { try { S.books = await api('books'); } catch { demo = true; } }
  if (demo) { S.books = SAMPLE; $('#demo').innerHTML = '<p class="s" style="margin-top:10px">Menampilkan contoh buku. Data asli tampil setelah URL API Apps Script dipasang.</p>'; }
  const u = [...new Set(S.books.map(b => b.jurusan))].sort();
  $('#j').innerHTML = '<option value="">Semua jurusan</option>' + u.map(x => `<option ${S.jur === x ? 'selected' : ''}>${esc(x)}</option>`).join('');
  $('#hs').innerHTML = [[S.books.length, 'Judul buku'], [u.length, 'Jurusan'], [S.books.reduce((a, b) => a + Number(b.stok), 0), 'Eksemplar tersedia']].map(x => `<div><b>${x[0]}</b><span>${x[1]}</span></div>`).join('');
  chips(); grid();
}
function chips() {
  const k = ['', ...new Set(S.books.map(b => b.kategori))].sort();
  $('#ch').innerHTML = k.map(x => `<button class="${S.kat === x ? 'on' : ''}" onclick="S.kat='${esc(x)}';chips();grid()">${x ? esc(x) : 'Semua kategori'}</button>`).join('');
}
function grid() {
  const q = S.q.toLowerCase(), L = S.books.filter(b => (!S.kat || b.kategori === S.kat) && (!S.jur || b.jurusan === S.jur) && (b.judul + b.penulis).toLowerCase().includes(q));
  $('#g').innerHTML = L.length ? L.map(b => { const h = hue(b.judul) % 50 + 190, out = Number(b.stok) < 1;
    return `<div class="card"><div class="in"><div class="cover" style="background:linear-gradient(150deg,hsl(${h},70%,45%),hsl(${h + 15},65%,22%))"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><path d="M6 20V8M12 20V4M18 20V8"/></svg><b>${esc(b.judul)}</b><span>${esc(b.penulis)} · ${esc(b.tahun)}</span></div>
    <div><span class="tag">${esc(b.kategori)}</span><span class="tag">${esc(b.jurusan)}</span></div><div><span class="chip ${out ? 'Ditolak' : 'Disetujui'}">${out ? 'Stok habis' : 'Tersedia ' + b.stok + '/' + b.total}</span></div>
    <button class="btn" ${out ? 'disabled' : ''} onclick="borrow('${b.id}')">Pinjam buku</button></div></div>`; }).join('')
    : '<p class="empty">Tidak ada buku yang cocok. Coba ubah kata kunci atau filter.</p>';
}
document.addEventListener('pointermove', e => { const c = e.target.closest && e.target.closest('.card'); if (!c) return; const r = c.getBoundingClientRect(), i = c.firstChild;
  i.style.setProperty('--ry', ((e.clientX - r.left) / r.width - .5) * 14 + 'deg'); i.style.setProperty('--rx', ((e.clientY - r.top) / r.height - .5) * -14 + 'deg'); });
document.addEventListener('pointerout', e => { const c = e.target.closest && e.target.closest('.card'); if (c) { c.firstChild.style.setProperty('--rx', '0deg'); c.firstChild.style.setProperty('--ry', '0deg'); } });

function borrow(id) {
  if (DEMO) return toast('Mode contoh: pasang URL API agar peminjaman dapat diproses');
  if (!S.u) return auth('register', id);
  const b = S.books.find(x => x.id === id);
  modal(`<h2>Ajukan peminjaman</h2><p class="s">${esc(b.judul)} — ${esc(b.penulis)}</p><label>Lama peminjaman</label><select id="dur"><option value="7">7 hari</option><option value="14">14 hari</option><option value="21">21 hari</option></select>
  <p class="s" style="margin-top:12px">Pengajuan akan diperiksa admin. Stok berkurang setelah disetujui.</p><button class="btn" style="width:100%" onclick="sendLoan('${id}')">Kirim pengajuan</button>`);
}
async function sendLoan(id) { await api('loan', { bookId: id, durasi: $('#dur').value }); shut(); toast('Pengajuan terkirim, tunggu persetujuan admin'); go('dash'); }

// ---------- DASHBOARD ----------
async function dash() {
  if (!S.u) return go('home');
  if (isAdm() && !S.u.passSet) return forcePw();
  return isAdm() ? admin() : userDash();
}
const loanRow = (l, act = '') => `<div class="row"><div><b>${esc(l.judul)}</b><br><small style="color:var(--mut)">${isAdm() ? esc(l.nama) + ' · ' : ''}Diajukan ${esc(l.tglAjuan)} · ${l.durasi} hari${l.jatuhTempo ? ' · Jatuh tempo ' + esc(l.jatuhTempo) : ''}</small></div><span class="chip ${l.status}">${l.status}</span>${act}</div>`;
async function userDash() {
  $('#v').innerHTML = `<div class="wrap"><h2 style="margin-top:34px">Halo, ${esc(S.u.nama)}</h2><div class="panel" id="p" style="min-height:50vh"></div></div>`;
  const L = await api('loans');
  $('#p').innerHTML = `<h3 style="margin-bottom:8px">Riwayat pinjaman</h3>` + (L.length ? L.map(l => loanRow(l)).join('') : '<p class="empty" style="padding:30px 0">Belum ada pinjaman. Buka katalog dan pilih buku pertama Anda.</p>');
}
// shell admin dibuat sekali; pindah tab hanya mengganti isi panel (tidak ada lompatan layout)
function admin() {
  const T = [['stat', '📊 Statistik'], ['loan', '📖 Pinjaman'], ['book', '📚 Buku'], ['adm', '👤 Admin']];
  $('#v').innerHTML = `<div class="wrap adm"><aside class="side"><div class="me"><b>${esc(S.u.nama)}</b>${esc(S.u.email)}</div>${T.map(t => `<button data-t="${t[0]}" onclick="setTab('${t[0]}')">${t[1]}</button>`).join('')}</aside><section class="panel main" id="p"></section></div>`;
  return setTab(S.tab);
}
function setTab(t) {
  S.tab = t; const id = ++S.rt;
  document.querySelectorAll('.side button').forEach(b => b.classList.toggle('on', b.dataset.t === t));
  return ({ stat: tStat, loan: tLoan, book: tBook, adm: tAdm })[t](id);
}
const stale = id => id !== S.rt;
async function tStat(id) {
  const s = await api('stats'); if (stale(id)) return; const mx = Math.max(1, ...Object.values(s.kat));
  $('#p').innerHTML = `<h2>Statistik perpustakaan</h2><div class="stats">${[['📚', 'judul', 'Judul buku'], ['📦', 'total', 'Total eksemplar'], ['✅', 'stok', 'Stok tersedia'], ['🔄', 'dipinjam', 'Sedang dipinjam'], ['⏳', 'menunggu', 'Menunggu persetujuan'], ['👥', 'anggota', 'Anggota']].map(x => `<div class="stat"><em>${x[0]}</em><b>${s[x[1]]}</b><span>${x[2]}</span></div>`).join('')}</div>
  <h3 style="margin:26px 0 6px">Peminjaman per kategori</h3><div class="bars">${Object.entries(s.kat).map(([k, v]) => `<div><span>${esc(k)}</span><i data-w="${v / mx * 100}"></i><b>${v}</b></div>`).join('') || '<p class="s">Belum ada data peminjaman.</p>'}</div>
  <h3 style="margin:26px 0 6px">Buku terpopuler</h3>${s.top.map(t => `<div class="row"><div>${esc(t[0])}</div><span class="chip">${t[1]}× dipinjam</span></div>`).join('') || '<p class="s">Belum ada data.</p>'}`;
  setTimeout(() => document.querySelectorAll('.bars i').forEach(i => i.style.width = i.dataset.w + '%'), 60);
}
async function tLoan(id) {
  const L = await api('loans'); if (stale(id)) return;
  $('#p').innerHTML = '<h2>Pengajuan & pinjaman</h2>' + (L.length ? L.map(l => loanRow(l, l.status === 'Menunggu' ? `<button class="btn sm ok" onclick="st('${l.id}','Disetujui')">Setujui</button><button class="btn sm bad" onclick="st('${l.id}','Ditolak')">Tolak</button>` : l.status === 'Disetujui' ? `<button class="btn sm" onclick="st('${l.id}','Dikembalikan')">Tandai dikembalikan</button>` : '')).join('') : '<p class="empty">Belum ada pengajuan pinjaman.</p>');
}
async function st(id, status) { await api('setStatus', { id, status }); toast('Status: ' + status); setTab('loan'); }
let EB = null;
async function tBook(id) {
  S.books = await api('books'); if (stale(id)) return; EB = null;
  $('#p').innerHTML = `<h2 id="ft">Tambah buku</h2><form class="f" onsubmit="event.preventDefault();saveBook()"><input id="b_j" placeholder="Judul" required><input id="b_p" placeholder="Penulis" required><input id="b_k" placeholder="Kategori" required><input id="b_u" placeholder="Jurusan" required><input id="b_t" type="number" placeholder="Tahun" required><input id="b_s" type="number" min="0" placeholder="Total eksemplar" required><button class="btn" id="bs">Simpan buku</button><button type="button" class="btn ghost" onclick="setTab('book')">Batal</button></form>
  <h3 style="margin:26px 0 6px">Daftar buku (${S.books.length})</h3>${S.books.map(b => `<div class="row"><div><b>${esc(b.judul)}</b><br><small style="color:var(--mut)">${esc(b.penulis)} · ${esc(b.kategori)} · ${esc(b.jurusan)} · stok ${b.stok}/${b.total}</small></div><button class="btn sm" onclick="editBook('${b.id}')">Edit</button><button class="btn sm bad" onclick="delBook('${b.id}')">Hapus</button></div>`).join('')}`;
}
function editBook(id) {
  const b = S.books.find(x => x.id === id); EB = id;
  [['j', 'judul'], ['p', 'penulis'], ['k', 'kategori'], ['u', 'jurusan'], ['t', 'tahun'], ['s', 'total']].forEach(([i, k]) => $('#b_' + i).value = b[k]);
  $('#ft').textContent = 'Edit buku'; $('#bs').textContent = 'Simpan perubahan'; scrollTo({ top: 0, behavior: 'smooth' });
}
async function saveBook() {
  await api('saveBook', { id: EB || undefined, total: $('#b_s').value, book: { judul: $('#b_j').value, penulis: $('#b_p').value, kategori: $('#b_k').value, jurusan: $('#b_u').value, tahun: $('#b_t').value } });
  toast(EB ? 'Buku diperbarui' : 'Buku ditambahkan'); setTab('book');
}
async function delBook(id) { if (!confirm('Hapus buku ini dari katalog?')) return; await api('delBook', { id }); toast('Buku dihapus'); setTab('book'); }
async function tAdm(id) {
  const A = await api('admins'); if (stale(id)) return;
  $('#p').innerHTML = `<h2>Kelola admin</h2><p class="s">Berikan password sementara. Admin baru akan diminta membuat password permanen (satu kali) saat pertama masuk.</p>
  <form class="f" onsubmit="event.preventDefault();addAdm()"><input id="m_n" placeholder="Nama" required><input id="m_e" type="email" placeholder="Email" required><input id="m_p" type="text" placeholder="Password sementara" required><button class="btn">Tambah admin</button></form>
  <h3 style="margin:26px 0 6px">Daftar admin</h3>${A.map(a => `<div class="row"><div><b>${esc(a.nama)}</b><br><small style="color:var(--mut)">${esc(a.email)}</small></div><span class="chip ${a.passSet ? 'Disetujui' : 'Menunggu'}">${a.passSet ? 'Aktif' : 'Belum atur password'}</span></div>`).join('')}`;
}
async function addAdm() { await api('addAdmin', { nama: $('#m_n').value, email: $('#m_e').value, password: $('#m_p').value }); toast('Admin ditambahkan'); setTab('adm'); }

(async () => { await go('home'); setTimeout(() => { S.hold = false; if (!busy) $('#ld').classList.remove('on'); if (isAdm() && !S.u.passSet) forcePw(); }, 900); })();
</script>
</body>
</html>
